# Every Python package in the repository lints by one set of rules, which live in the
# configuration this extends.
extend = "../lightly_studio/ruff.toml"

# Ruff resolves a relative pattern against the directory of the file that declares it, so the
# extended configuration's test ignores cover only its own tests. Each package lists the ignores
# its own tests need.
[lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "D107", "PLR2004", "SLF001"]
