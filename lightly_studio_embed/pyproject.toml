[project]
name = "lightly-studio-embed"
version = "0.1.0"
description = "Serve your own embedding model to LightlyStudio over HTTP."
readme = "README.md"
# Matches lightly-studio, so a customer stuck on an old inference image can still install it.
requires-python = ">=3.9,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

# An HTTP server and nothing else. This package installs next to a customer's own CUDA and
# torch pins, so anything heavier would fight them.
dependencies = [
    "fastapi>=0.115.5",
    "pydantic>=2.0",
    # Starlette parses the multipart bodies of the bytes endpoints through it. The floor is
    # the first release fixing CVE-2026-53540, after a run of parser DoS advisories
    # (CVE-2026-40347, CVE-2026-42561, CVE-2026-53537..53539). Python 3.9 is stuck on
    # 0.0.20, the last release that supports it, so a 3.9 host keeps those weaknesses in its
    # multipart parser.
    # TODO(Iunir, 09/2026): Drop the 3.9 pin once `lightly-studio` drops Python 3.9.
    "python-multipart>=0.0.31; python_version >= '3.10'",
    "python-multipart>=0.0.20; python_version < '3.10'",
    "uvicorn>=0.32.1",
]

[dependency-groups]
# The same floors as the repository's other Python packages, so the tooling behaves alike.
dev = [
    # The FastAPI test client is an httpx transport.
    "httpx>=0.27.2",
    "mypy>=1.19.1",
    "pytest>=8.3.3",
    "ruff>=0.7.4",
]

[tool.mypy]
strict = true
disallow_untyped_defs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_untyped_fields = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
python_files = "tests/*.py tests/**/*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/lightly_studio_embed"]

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_studio_embed"]
