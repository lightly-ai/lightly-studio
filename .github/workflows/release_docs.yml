name: Release Documentation

# Builds the docs at a tag and uploads them to docs-proxy, the VM behind
# https://docs.lightly.ai/studio.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or branch to checkout, e.g. v0.0.0'
        required: true
        type: string
      allow_version_mismatch:
        description: 'Required when tag is a branch or commit SHA rather than a vX.Y.Z tag: explicitly skip the version assert instead of failing.'
        required: false
        type: boolean
        default: false

permissions: {}

# Queued rather than cancelled: a cancelled upload leaves the site half-copied.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Runs the checked-out ref's own code (mkdocs hooks), so it gets no secrets:
  # all it hands onwards is the built site.
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ALLOW_VERSION_MISMATCH: ${{ inputs.allow_version_mismatch }}
    steps:
      # `refs/tags/` for a vX.Y.Z tag because actions/checkout resolves an
      # unqualified ref as a branch first, and a branch sharing the tag's name
      # would be built in the tag's place.
      - name: Resolve the ref
        id: ref
        run: |
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert Version in Code Matches Release Tag
        run: |
          VERSION_FROM_TOML=$(grep -oP '^\s*version\s*=\s*"\K[^"]+' lightly_studio/pyproject.toml)
          VERSION_FROM_TOML="v$VERSION_FROM_TOML"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            if [ "$ALLOW_VERSION_MISMATCH" != "true" ]; then
              echo "::error::'$RELEASE_TAG' is not a vX.Y.Z tag, so it cannot be checked against the version in pyproject.toml ($VERSION_FROM_TOML). Per RELEASE.md this is expected when releasing docs from a branch or a fix commit; if that's the case here, re-run this workflow with allow_version_mismatch=true."
              exit 1
            fi
            echo "::warning::Skipping version assert: '$RELEASE_TAG' is not a vX.Y.Z tag and allow_version_mismatch=true was set explicitly. Version in pyproject.toml is $VERSION_FROM_TOML; it was NOT checked against '$RELEASE_TAG'."
          elif [ "$VERSION_FROM_TOML" != "$RELEASE_TAG" ]; then
            echo "Version mismatch: Tag is $RELEASE_TAG, but version in pyproject.toml is $VERSION_FROM_TOML"
            exit 1
          else
            echo "version from pyproject.toml $VERSION_FROM_TOML matches tag $RELEASE_TAG"
          fi
      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cd lightly_studio/docs && make docs
      - name: Upload the Site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: lightly_studio/docs/site
          if-no-files-found: error
          retention-days: 7

  # Runs no ref-controlled code: it only downloads the site and copies it.
  # GCP_SERVICE_ACCOUNT_KEY is an org secret, so the gate is the default-branch
  # ref, as in finish_release.yml: a dispatch from another branch builds but
  # never deploys.
  release-documentation:
    name: Release documentation
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Download the Site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      # Pinned by digest: these steps see the GCP key.
      - id: 'auth'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Set up gcloud sdk
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: "421.0.0"
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - name: Clean up stale OS Login SSH keys
        run: |
          echo "=== Fingerprints found ==="
          gcloud compute os-login ssh-keys list --format="value(key)"

          echo ""
          echo "=== Attempting removal (continue on error) ==="
          set +e
          for fp in $(gcloud compute os-login ssh-keys list --format="value(key)"); do
            echo "--- Removing $fp ---"
            gcloud compute os-login ssh-keys remove --key "$fp"
            echo "exit code: $?"
          done
          set -e

          echo ""
          echo "=== Keys remaining ==="
          gcloud compute os-login ssh-keys list --format="value(key)" | wc -l
      # --quiet: a fresh runner has to generate its SSH key without a prompt.
      - name: Release
        env:
          DOCS_INSTANCE_ZONE: ${{ secrets.DOCS_INSTANCE_ZONE }}
          DOCS_INSTANCE_ID: ${{ secrets.DOCS_INSTANCE_ID }}
          DOCS_INSTANCE_DIR: ${{ secrets.DOCS_INSTANCE_DIR }}
        run: |
          gcloud compute scp --quiet \
            --zone "$DOCS_INSTANCE_ZONE" \
            --recurse ./site/* "$DOCS_INSTANCE_ID:$DOCS_INSTANCE_DIR/lightly-studio/docs/site"

  slack-notification:
    name: Send Slack Notification
    needs:
      - build
      - release-documentation
    # Also on a failed build, but not for a branch dispatch, which never deploys.
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12
      - name: Send Slack Notification
        env:
          # Go to https://api.slack.com/apps/ to configure the Action Bot
          SLACK_TOKEN: ${{ secrets.SLACK_ACTION_BOT_TOKEN }}
          JOB_STATUS: ${{ needs.release-documentation.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: uv run --no-project --with slack_sdk==3.34.0 python {0}
        run: |
          from slack_sdk import WebClient
          import os

          run_link = f"<https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}|View workflow run>"

          job_status = os.environ["JOB_STATUS"]

          if job_status == "success":
              message = (
                  ":white_check_mark: LightlyStudio documentation release succeeded.\n"
                  "https://docs.lightly.ai/studio\n"
                  f"{run_link}"
              )
          else:
              message = (
                  ":x: LightlyStudio documentation release failed. "
                  f"Please check the logs and take necessary action. {run_link}"
              )

          slack_client = WebClient(token=os.environ["SLACK_TOKEN"])
          slack_client.chat_postMessage(
              channel="releases",
              text=message
          )
