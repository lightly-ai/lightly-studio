name: Announce Release

# Posts a released changelog section to the Slack channel sales reads. Called by Finish
# Release once the wheel is on PyPI and the release is public, and dispatchable on its own
# to re-post one or to rehearse against a test channel.
#
# Not `on: release: published`: Finish Release un-drafts the release with GITHUB_TOKEN, and
# GitHub creates no workflow run from a GITHUB_TOKEN-triggered event. That trigger would
# fire when somebody un-drafts by hand and stay silent on every real release.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag of the published release, e.g. v1.2.3.
        type: string
        required: true
      channel:
        description: Channel to post in. Empty for the release channel.
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the published release, e.g. v1.2.3.
        type: string
        required: true
      channel:
        description: >-
          Channel to post in. Leave empty for the release channel; name a test
          channel to rehearse. Nothing here stops a second post of the same tag.
        type: string
        required: false
        default: ""

permissions: {}

env:
  # The channel and the message template are the two things a public workflow file
  # discloses here. Neither is a secret; the bot token is, and it lives in the environment.
  SLACK_CHANNEL: studio-issues-and-feedback

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Where SLACK_ACTION_BOT_TOKEN lives, so the token is unreadable from any job that does
    # not declare it. Restricted to `main`, like `pypi`: both are reached from a run whose
    # ref is the branch Finish Release was dispatched from, never the release tag.
    environment: slack
    permissions:
      contents: read
    steps:
      # The tooling is taken from main, never from the released tag: running that commit's
      # own release code would execute it with the bot token in the environment.
      - name: Checkout the release tooling
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Everything that differs between the packages comes from here.
      - name: Resolve the package
        id: package
        env:
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          TAG: ${{ inputs.tag }}
        run: |
          python3 -m prepare_release package-config --tag "${TAG}" >> "$GITHUB_OUTPUT"

      - name: Render the announcement
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/.github/scripts
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          CHANGELOG: ${{ steps.package.outputs.changelog }}
        # The changelog is read at the tag, not from main, which has moved on since. Asking
        # for the release URL also asserts that the release exists and is readable.
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/contents/${CHANGELOG}?ref=${TAG}" \
            -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/CHANGELOG.md"
          release_url="$(gh release view "${TAG}" --repo "${REPO}" --json url --jq .url)"
          python3 -m prepare_release render-slack-message \
            --changelog "${RUNNER_TEMP}/CHANGELOG.md" \
            --tag "${TAG}" \
            --release-url "${release_url}" \
            --output "${RUNNER_TEMP}/slack-message.txt"
          cat "${RUNNER_TEMP}/slack-message.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Post the announcement
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_ACTION_BOT_TOKEN }}
          CHANNEL: ${{ inputs.channel || env.SLACK_CHANNEL }}
          TAG: ${{ inputs.tag }}
        # The message reaches the payload through `jq --rawfile`, so neither a `${{ }}`
        # expansion nor shell quoting ever sees it. No `set -x` and no `curl -v`: both
        # would print the bearer token. Slack answers a rejected message with `ok: false`
        # and HTTP 200, so the status code alone would report a silent success.
        run: |
          set -euo pipefail
          jq -n --arg channel "${CHANNEL}" --rawfile text "${RUNNER_TEMP}/slack-message.txt" \
            '{channel: $channel, text: $text, unfurl_links: false, unfurl_media: false}' \
            > "${RUNNER_TEMP}/slack-payload.json"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data @"${RUNNER_TEMP}/slack-payload.json" > "${RUNNER_TEMP}/slack-response.json"
          if [ "$(jq -r .ok < "${RUNNER_TEMP}/slack-response.json")" != "true" ]; then
            echo "::error::Slack rejected the message: $(jq -r .error < "${RUNNER_TEMP}/slack-response.json")"
            exit 1
          fi
          echo "::notice::Announced ${TAG} in #${CHANNEL}."
