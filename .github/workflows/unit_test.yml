name: Unit Test

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=4096
  # Every run restores the uv cache, only main writes one: per-ref copies are
  # ~3.4GB each and blew the 10GB quota, evicting the caches the e2e skip needs.
  # The Python version is part of the uv cache key, so each step passes the one its job runs:
  # the 3.9 jobs share an entry instead of the release-tooling key, whose deps are ~30MB.
  UV_SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

  
jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      # Empty when the filter is skipped (non-PR/MG events), so `|| 'true'`
      # runs everything. A real 'false' is non-empty and preserved.
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      docs: ${{ steps.filter.outputs.docs || 'true' }}
      fast_track: ${{ steps.filter.outputs.fast_track || 'true' }}
      release_tooling: ${{ steps.filter.outputs.release_tooling || 'true' }}
      lightly_embed: ${{ steps.filter.outputs.lightly_embed || 'true' }}
    steps:
      - name: Checkout Code # Needed for merge_group event
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        # Other events have no base to diff; they fall back to running all jobs.
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            # List paths in `lightly_studio/` to exclude triggering on docs.
            # E2E tests and examples are included for static checks.
            backend:
              - '.github/workflows/unit_test.yml'
              - 'lightly_studio/src/**'
              - 'lightly_studio/tests/**'
              - 'lightly_studio/e2e-tests/**'
              - 'lightly_studio/dataset_examples/**'
              - 'lightly_studio/pyproject.toml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'lightly_studio/ruff.toml'
              - 'lightly_studio/pytest.ini'
              - 'lightly_studio/Makefile'
              - 'lightly_studio/alembic.ini'
            frontend:
              - '.github/workflows/unit_test.yml'
              - 'lightly_studio_view/**'
            docs:
              - '.github/workflows/unit_test.yml'
              - 'lightly_studio/docs/**'
            # Self-contained Node package (guardrails + bot); Node-only toolchain.
            fast_track:
              - '.github/workflows/unit_test.yml'
              - 'fast_track/**'
            # Release tooling: CI-internal, so it has its own toolchain.
            release_tooling:
              - '.github/workflows/unit_test.yml'
              - '.github/scripts/**'
            # The second workspace member. Shares the lockfile, not the dependencies.
            lightly_embed:
              - '.github/workflows/unit_test.yml'
              - 'lightly_embed/**'
              - 'lightly_studio/ruff.toml'
              - 'pyproject.toml'
              - 'uv.lock'

  check-python:
    name: Static Checks Python
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.9"
          enable-cache: true
          save-cache: ${{ env.UV_SAVE_CACHE }}

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install LightlyStudio dependencies
        working-directory: lightly_studio
        run: make install-optional-deps

      - name: Run checks for LightlyStudio
        working-directory: lightly_studio
        run: make static-checks

  check-typescript:
    name: Static Checks Typescript
    needs: detect
    # Backend changes can alter the exported schema/version, hence the generated TS.
    if: needs.detect.outputs.frontend == 'true' || needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.9"
          enable-cache: true
          save-cache: ${{ env.UV_SAVE_CACHE }}

      - name: Install LightlyStudio dependencies
        working-directory: lightly_studio
        run: make install-optional-deps

      - name: Export schema and generate version file from backend
        working-directory: lightly_studio
        run: |
          make export-schema
          make export-version

      # `make build` installs deps (build: install) before building.
      - name: Build app to get svelte types
        working-directory: lightly_studio_view
        run:  make build

      - name: Make static checks
        working-directory: lightly_studio_view
        run: make static-checks

  test-backend:
    name: Backend (${{ matrix.python }}, ${{ matrix.database }})
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Postgres is only tested on 3.14 because PostgreSQL dialect/driver
          # behavior doesn't vary by Python version.
          - python: "3.9"
            database: DuckDB
            make_target: test
          - python: "3.14"
            database: DuckDB
            make_target: test
          - python: "3.14"
            database: Postgres
            make_target: test-postgres
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
          save-cache: ${{ env.UV_SAVE_CACHE }}

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install LightlyStudio dependencies
        working-directory: lightly_studio
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make install-optional-deps

      - name: Check Alembic migrations
        if: matrix.database == 'Postgres'
        working-directory: lightly_studio
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make migration-check-postgresql

      - name: Run Tests for LightlyStudio
        working-directory: lightly_studio
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make ${{ matrix.make_target }}

  test-frontend:
    name: Frontend Tests
    needs: detect
    # View tests are Python-version independent, so they run in a single job
    # instead of across the backend matrix. Backend changes can alter the
    # exported schema (and thus the generated API client), hence `backend` too.
    if: needs.detect.outputs.frontend == 'true' || needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.9"
          enable-cache: true
          save-cache: ${{ env.UV_SAVE_CACHE }}

      - name: Install LightlyStudio dependencies
        working-directory: lightly_studio
        run: make install-optional-deps

      # The view test suite imports the generated API client, which is built
      # from the backend's exported schema.
      - name: Export schema and generate version file from backend
        working-directory: lightly_studio
        run: |
          make export-schema
          make export-version

      # `make build` installs deps (build: install) before building.
      - name: Build app
        working-directory: lightly_studio_view
        run: make build

      - name: Run Tests for lightly_studio_view
        working-directory: lightly_studio_view
        run: make test

  check-docs:
    name: Build Docs
    needs: detect
    # API reference is generated from backend docstrings.
    if: needs.detect.outputs.docs == 'true' || needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.9"
          enable-cache: true
          save-cache: ${{ env.UV_SAVE_CACHE }}

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install LightlyStudio dependencies
        working-directory: lightly_studio
        run: make install-optional-deps

      # `make docs` checks broken links.
      - name: Build docs
        working-directory: lightly_studio/docs
        run: make docs

  check-fast-track:
    name: Static Checks + Tests Fast Track
    needs: detect
    if: needs.detect.outputs.fast_track == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast_track
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Pin Node from .nvmrc, matching the local Makefile's nvm setup.
      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: fast_track/.nvmrc
          cache: npm
          cache-dependency-path: fast_track/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run static-checks

      - name: Tests
        run: npm run test

  check-release-tooling:
    name: Static Checks + Tests Release Tooling
    needs: detect
    if: needs.detect.outputs.release_tooling == 'true'
    runs-on: ubuntu-latest
    # This job runs code the pull request itself supplies - pytest collects the
    # PR's conftest.py, and `uv run --with` resolves tools from PyPI at job
    # time. The repository default is a write-scoped token, so pin this job to
    # read-only and keep the token out of .git/config.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .github/scripts
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true
          save-cache: ${{ env.UV_SAVE_CACHE }}

      - name: Static checks
        run: make static-checks

      - name: Tests
        run: make test

  check-lightly-embed:
    name: Static Checks + Tests LightlyEmbed (${{ matrix.python }})
    needs: detect
    if: needs.detect.outputs.lightly_embed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of `requires-python`; nothing in the package is version
        # specific.
        python: ["3.9", "3.14"]
    # This job runs Makefile targets the pull request itself supplies. The repository default is
    # a write-scoped token, so it is pinned to read-only and kept out of .git/config, the same
    # way check-release-tooling is.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: lightly_embed
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
          save-cache: ${{ env.UV_SAVE_CACHE }}

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # No install step: the package has no extras and no non-default groups, so `uv run`
      # installs everything these targets need.
      - name: Static checks
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make static-checks

      - name: Tests
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make test

      # The invariant the whole package exists for. Asserted on the built wheel, because that
      # is what a customer installs onto an inference box next to their own torch pins.
      - name: Assert the wheel pulls in nothing heavy
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: make check-wheel-dependencies WHEEL_PYTHON_VERSION=${{ matrix.python }}

  # The single required status check: always runs, so gated jobs can be skipped
  # without stranding the merge queue. Require this in the branch ruleset.
  unit-success:
    name: CI Success Check
    runs-on: ubuntu-latest
    needs:
      - detect
      - check-python
      - check-typescript
      - test-backend
      - test-frontend
      - check-docs
      - check-fast-track
      - check-release-tooling
      - check-lightly-embed
    if: always()
    steps:
      - name: Verify required jobs
        env:
          DETECT: ${{ needs.detect.result }}
          PYTHON_CHECKS: ${{ needs.check-python.result }}
          TYPESCRIPT_CHECKS: ${{ needs.check-typescript.result }}
          BACKEND_TESTS: ${{ needs.test-backend.result }}
          FRONTEND_TESTS: ${{ needs.test-frontend.result }}
          DOCS: ${{ needs.check-docs.result }}
          FAST_TRACK: ${{ needs.check-fast-track.result }}
          RELEASE_TOOLING: ${{ needs.check-release-tooling.result }}
          LIGHTLY_EMBED: ${{ needs.check-lightly-embed.result }}
        run: |
          python3 - <<'PY'
          import os
          import sys

          # If detection failed, jobs were skipped for the wrong reason.
          detect = os.environ["DETECT"]
          if detect != "success":
              sys.exit(f"::error::Change detection did not succeed (result={detect}); failing the gate.")

          # A gated job is fine only if it passed or was skipped.
          gated = {
              "Static Checks Python": os.environ["PYTHON_CHECKS"],
              "Static Checks Typescript": os.environ["TYPESCRIPT_CHECKS"],
              "Backend tests": os.environ["BACKEND_TESTS"],
              "Frontend tests": os.environ["FRONTEND_TESTS"],
              "Build Docs": os.environ["DOCS"],
              "Static Checks + Tests Fast Track": os.environ["FAST_TRACK"],
              "Static Checks + Tests Release Tooling": os.environ["RELEASE_TOOLING"],
              "Static Checks + Tests LightlyEmbed": os.environ["LIGHTLY_EMBED"],
          }
          allowed = {"success", "skipped"}

          for name, result in gated.items():
              print(f"{name}: {result}")

          failed = {name: result for name, result in gated.items() if result not in allowed}
          if failed:
              for name, result in failed.items():
                  print(f"::error::Required job '{name}' finished with result '{result}'.")
              sys.exit(1)

          print("All required jobs passed or were skipped.")
          PY
