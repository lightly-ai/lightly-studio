# The header renders this as the wordmark, split two-tone by custom.js, so it
# is the product name alone — "Docs" is what the whole site is.
site_name: LightlyStudio
site_description: LightlyStudio Documentation
site_url: https://docs.lightly.ai/studio


theme:
  name: material
  language: en
  # `overrides/` holds four templates. `main.html` and `partials/site_footer.html`
  # are additive — they append the site footer under Material's prev/next pager.
  # `partials/header.html` and `partials/nav.html` are FORKS of the same-named
  # Material 9.7.5 partials, carrying the section tab strip and the sidebar
  # scoping it does (see `extra.tabs` below). Upstream regenerates both files
  # between releases and shadowing them is silent, so re-diff them against
  # `material/templates/partials/` whenever mkdocs-material is bumped.
  custom_dir: overrides
  # Mark only. The full logo carries a white wordmark, which is invisible on the
  # light header; the wordmark is rendered as text instead (see custom.css).
  logo: _static/lightly_mark.svg
  favicon: _static/lightly_logo_fav.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  # Callout icons. Material's own set is Material Design icons drawn on a 24px
  # grid; at the 17px this theme renders them the filled ones (note, danger,
  # info) collapse into a dot. Octicons are drawn at 16px, so they stay legible,
  # they carry one stroke weight across the set, and the palette toggle above
  # already uses them. The note/tip/warning/danger picks match GitHub's own
  # alert icons. Aliases (`hint`, `caution`, `error`, ...) map onto these in
  # _static/custom.css.
  icon:
    admonition:
      note: octicons/note-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/light-bulb-16
      success: octicons/check-circle-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/stop-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  # `custom` opts out of Material's built-in color rules so the palette in
  # _static/custom.css is the only thing setting colors. Without it Material
  # falls back to `indigo` and its `[scheme][primary]` rules outrank ours.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: octicons/moon-16
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: octicons/sun-16
        name: Switch to light mode
  features:
    # Navigation lives entirely in the left sidebar: every section is a group
    # caption with its pages listed under it, no top-level tab row.
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.highlight
    - search.suggest

repo_url: https://github.com/lightly-ai/lightly-studio
repo_name: LightlyStudio
docs_dir: docs

# Read by the footer. Material's own `.md-footer-meta` bar stays hidden.
copyright: "© 2026 Lightly · Apache 2.0"

# Sets `extra.package_version` from the installed package, so the footer does not
# carry a second copy of the version. See `mkdocs_hooks.py`.
hooks:
  - mkdocs_hooks.py

nav:
  - Getting Started:
    - index.md
  - Enterprise:
    - Enterprise:
      - enterprise/index.md
      - Collaboration and Permissions: enterprise/collaboration.md
      - Connect from Python: enterprise/connect.md
      - Security and Architecture: enterprise/security.md
      - On-Premise Deployment: enterprise/on-premise.md
      - Local Storage: enterprise/local_storage.md
    - Cloud Storage:
      - enterprise/cloud_storage/index.md
      - AWS S3: enterprise/cloud_storage/aws.md
      - Google Cloud Storage: enterprise/cloud_storage/gcs.md
  - Tutorials:
    - tutorials/index.md
    - "Tutorial 1: Curate a Traffic CCTV Dataset for YOLO Training": tutorials/yolo-traffic-cctv-object-detection.md
    - "Tutorial 2: Evaluate YOLO26 on Your Dataset with LightlyStudio": tutorials/yolo26-model-evaluation.md
  - Dataset Setup:
    - Data Types:
      - Image Dataset: dataset_setup/image_dataset.md
      - Video Dataset: dataset_setup/video_dataset.md
    - Setup Options:
      - Run LightlyStudio from a Notebook: dataset_setup/notebooks.md
      - Cloud Storage: dataset_setup/cloud_storage.md
      - Reuse Datasets: dataset_setup/reuse_datasets.md
  - Python API:
    - API Reference:
      - Dataset: api/dataset.md
      - Sample: api/sample.md
      - DatasetQuery: api/dataset_query.md
      - Sampling: api/sampling.md
      - Embeddings: api/embeddings.md
      - Plugin: api/plugin.md
      - Annotation: api/annotation.md
      - Model Evaluation: api/evaluation.md
  - Concepts & Tools:
    - Concepts:
      - Annotations: concepts_and_tools/annotations.md
      - Tags: concepts_and_tools/tags.md
      - Captions: concepts_and_tools/captions.md
      - Metadata: concepts_and_tools/metadata.md
      - Embeddings: concepts_and_tools/embeddings.md
    - Tools:
      - Search and Filter: concepts_and_tools/search_and_filter.md
      - Dataset Distributions: concepts_and_tools/dataset_distributions.md
      - Export: concepts_and_tools/export.md
      - Sampling: concepts_and_tools/sampling.md
      - Plugins: concepts_and_tools/plugins.md
      - Model Evaluation: concepts_and_tools/evaluation.md
    - More:
      - Lightly Query Language: concepts_and_tools/lightly_query_language.md
  - About Us:
    - about_us/index.md

# Promote link/nav checks from INFO to WARNING so that `mkdocs build --strict`
# turns them into build errors (see the Makefile `docs` target).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

extra_css:
  # Display face for headings and the wordmark. Body and code faces come from
  # `theme.font`, which Material loads from the same CDN.
  - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap
  - _static/custom.css

extra_javascript:
  - _static/custom.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../src
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
              returns_multiple_items: false
            heading_level: 2
            merge_init_into_class: true
            show_source: false
            show_root_heading: false
            show_root_toc_entry: true
            show_symbol_type_heading: false
            show_symbol_type_toc: true
            group_by_category: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 100
            show_category_heading: false # Do not show "Classes", "Functions", ...
            inherited_members: true
            show_bases: true
            show_signature_type_parameters: true
            type_parameter_headings: true
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra:
  homepage: https://lightly.ai/lightly-studio
  # The header tab strip. Each tab claims top-level `nav:` sections and scopes
  # the sidebar to them, so a reader in Tutorials sees the tutorials and nothing
  # else. `nav:` itself is untouched: the mapping is by section title, and a
  # section no tab claims joins the one marked `default` rather than falling out
  # of the site. Where each tab lands is derived from `nav:` at build time, not
  # written down here, so it follows a section that moves.
  #
  # `mkdocs_hooks.py` resolves this into `extra.tab_links` and
  # `extra.tab_sections`, and warns — fatally, under `--strict` — when a tab
  # claims a section `nav:` no longer has.
  tabs:
    - name: Docs
      default: true
      sections:
        - Getting Started
        - Dataset Setup
        - Python API
        - Concepts & Tools
        - About Us
    - name: Tutorials
      sections:
        - Tutorials
    - name: Enterprise
      sections:
        - Enterprise
  # Footer link columns. An `href` with a scheme is used as written; anything
  # else is a path relative to the site root.
  footer:
    tagline: Open-source curation and annotation for vision datasets.
    columns:
      - name: Community
        links:
          - label: GitHub
            href: https://github.com/lightly-ai/lightly-studio
          - label: Discord
            href: https://discord.com/invite/xvNJW94
          - label: Release notes
            href: https://github.com/lightly-ai/lightly-studio/releases
          - label: Contact support
            href: https://www.lightly.ai/contact
      - name: Docs
        links:
          - label: Getting started
            href: .
          - label: Tutorials
            href: tutorials/
          - label: Dataset setup
            href: dataset_setup/image_dataset/
          - label: Python API reference
            href: api/dataset/
      - name: Product
        links:
          - label: LightlyStudio
            href: https://www.lightly.ai/lightly-studio
          - label: Enterprise
            href: enterprise/
          - label: About us
            href: about_us/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lightly-ai/lightly-studio
      name: Lightly on GitHub
  analytics:
    provider: google
    property: G-F7ZZV5GFRB

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  # `pygments_lang_class` puts the fence language on the wrapper as
  # `language-python`, which is the only hook the header label has to read from.
  # See `labelCodeBlocks` in _static/custom.js.
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
