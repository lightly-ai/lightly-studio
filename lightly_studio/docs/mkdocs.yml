# The header renders this as the wordmark, split two-tone by custom.js, so it
# is the product name alone — "Docs" is what the whole site is.
site_name: LightlyStudio
site_description: LightlyStudio Documentation
site_url: https://docs.lightly.ai/studio


theme:
  name: material
  language: en
  # Mark only. The full logo carries a white wordmark, which is invisible on the
  # light header; the wordmark is rendered as text instead (see custom.css).
  logo: _static/lightly_mark.svg
  favicon: _static/lightly_logo_fav.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  # `custom` opts out of Material's built-in color rules so the palette in
  # _static/custom.css is the only thing setting colors. Without it Material
  # falls back to `indigo` and its `[scheme][primary]` rules outrank ours.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # Navigation lives entirely in the left sidebar: every section is a group
    # caption with its pages listed under it, no top-level tab row.
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.highlight
    - search.suggest

repo_url: https://github.com/lightly-ai/lightly-studio
repo_name: LightlyStudio
docs_dir: docs

nav:
  - Getting Started:
    - index.md
  - Enterprise:
    - Enterprise:
      - enterprise/index.md
      - Collaboration and Permissions: enterprise/collaboration.md
      - Connect from Python: enterprise/connect.md
      - Security and Architecture: enterprise/security.md
      - On-Premise Deployment: enterprise/on-premise.md
      - Local Storage: enterprise/local_storage.md
    - Cloud Storage:
      - enterprise/cloud_storage/index.md
      - AWS S3: enterprise/cloud_storage/aws.md
      - Google Cloud Storage: enterprise/cloud_storage/gcs.md
  - Tutorials:
    - tutorials/index.md
    - "Tutorial 1: Curate a Traffic CCTV Dataset for YOLO Training": tutorials/yolo-traffic-cctv-object-detection.md
    - "Tutorial 2: Evaluate YOLO26 on Your Dataset with LightlyStudio": tutorials/yolo26-model-evaluation.md
  - Dataset Setup:
    - Data Types:
      - Image Dataset: dataset_setup/image_dataset.md
      - Video Dataset: dataset_setup/video_dataset.md
    - Setup Options:
      - Run LightlyStudio from a Notebook: dataset_setup/notebooks.md
      - Cloud Storage: dataset_setup/cloud_storage.md
      - Reuse Datasets: dataset_setup/reuse_datasets.md
  - Python API:
    - API Reference:
      - Dataset: api/dataset.md
      - Sample: api/sample.md
      - DatasetQuery: api/dataset_query.md
      - Sampling: api/sampling.md
      - Embeddings: api/embeddings.md
      - Plugin: api/plugin.md
      - Annotation: api/annotation.md
      - Model Evaluation: api/evaluation.md
  - Concepts & Tools:
    - Concepts:
      - Annotations: concepts_and_tools/annotations.md
      - Tags: concepts_and_tools/tags.md
      - Captions: concepts_and_tools/captions.md
      - Metadata: concepts_and_tools/metadata.md
      - Embeddings: concepts_and_tools/embeddings.md
    - Tools:
      - Search and Filter: concepts_and_tools/search_and_filter.md
      - Dataset Distributions: concepts_and_tools/dataset_distributions.md
      - Export: concepts_and_tools/export.md
      - Sampling: concepts_and_tools/sampling.md
      - Plugins: concepts_and_tools/plugins.md
      - Model Evaluation: concepts_and_tools/evaluation.md
    - More:
      - Lightly Query Language: concepts_and_tools/lightly_query_language.md
  - About Us:
    - about_us/index.md

# Promote link/nav checks from INFO to WARNING so that `mkdocs build --strict`
# turns them into build errors (see the Makefile `docs` target).
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn

extra_css:
  # Display face for headings and the wordmark. Body and code faces come from
  # `theme.font`, which Material loads from the same CDN.
  - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap
  - _static/custom.css

extra_javascript:
  - _static/custom.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ../src
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
              returns_multiple_items: false
            heading_level: 2
            merge_init_into_class: true
            show_source: false
            show_root_heading: false
            show_root_toc_entry: true
            show_symbol_type_heading: false
            show_symbol_type_toc: true
            group_by_category: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 100
            show_category_heading: false # Do not show "Classes", "Functions", ...
            inherited_members: true
            show_bases: true
            show_signature_type_parameters: true
            type_parameter_headings: true
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true

extra:
  homepage: https://lightly.ai/lightly-studio
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lightly-ai/lightly-studio
      name: Lightly on GitHub
  analytics:
    provider: google
    property: G-F7ZZV5GFRB

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
