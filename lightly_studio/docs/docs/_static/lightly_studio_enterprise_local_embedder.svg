<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc">
  <title id="title">Your Own Model in a Local Embedder</title>
  <desc id="desc">A Python script registers a local embedder, which runs your model inside the script. The script sends the vectors to LightlyStudio Enterprise, where the embedding plot and sampling read them. Similarity search is not available in this setup.</desc>
  <defs>
    <style>
      .panel-env { fill: #ffffff; stroke: #b8c2c1; stroke-width: 2; stroke-dasharray: 8 6; }
      .panel-ls { fill: #e3f3f2; }
      .panel-title { fill: #17272a; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .panel-title-ls { fill: #14897f; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #d3dbda; stroke-width: 2; }
      .card-off { fill: #f3f6f6; stroke: #b8c2c1; stroke-width: 2; stroke-dasharray: 7 5; }
      .icon-off { fill: none; stroke: #9aa6a5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .title-off { fill: #8a9796; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .icon { fill: none; stroke: #17272a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #17272a; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .sub { fill: #4b5a59; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 17px; }
      .mono { fill: #4b5a59; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 16px; }
      .edge { stroke: #7c8c8a; stroke-width: 2.5; fill: none; }
      .edge-search { stroke: #1aa39a; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; }
      .edge-label { fill: #5d6b6a; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 17px; font-style: italic; }
      .edge-label-search { fill: #14897f; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 17px; font-style: italic; }
      .caption { fill: #5d6b6a; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#7c8c8a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-search" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1aa39a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="panel-env" x="30" y="20" width="400" height="490" rx="24"/>
  <text class="panel-title" x="62" y="62">Your Environment</text>
  <rect class="panel-ls" x="590" y="20" width="400" height="490" rx="24"/>
  <text class="panel-title-ls" x="622" y="62">LightlyStudio Enterprise</text>
  <g>
    <title>Python Script</title>
    <rect class="card" x="70" y="100" width="320" height="140" rx="16"/>
    <g class="icon" transform="translate(215 122) scale(1.25)"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 3 3-3 3"/><path d="M12 15h6"/></g>
    <text class="title" x="230" y="190" text-anchor="middle">Python Script</text>
    <text class="mono" x="230" y="217" text-anchor="middle">ls.connect()</text>
  </g>
  <g>
    <title>Local Embedder</title>
    <rect class="card" x="70" y="330" width="320" height="140" rx="16"/>
    <g class="icon" transform="translate(215 352) scale(1.25)"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></g>
    <text class="title" x="230" y="420" text-anchor="middle">Local Embedder</text>
    <text class="sub" x="230" y="447" text-anchor="middle">your model in the script</text>
  </g>
  <g>
    <title>Plot and Sampling</title>
    <rect class="card" x="630" y="100" width="320" height="140" rx="16"/>
    <g class="icon" transform="translate(775 122) scale(1.25)"><path d="M3 3v18h18"/><circle cx="8.5" cy="14.5" r="1.6"/><circle cx="13" cy="9" r="1.6"/><circle cx="17.5" cy="12.5" r="1.6"/><circle cx="12" cy="16" r="1.6"/></g>
    <text class="title" x="790" y="190" text-anchor="middle">Plot and Sampling</text>
    <text class="sub" x="790" y="217" text-anchor="middle">read the stored vectors</text>
  </g>
  <g>
    <title>Similarity Search</title>
    <rect class="card-off" x="630" y="330" width="320" height="140" rx="16"/>
    <g class="icon-off" transform="translate(775 352) scale(1.25)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></g>
    <text class="title-off" x="790" y="420" text-anchor="middle">Similarity Search</text>
    <text class="sub" x="790" y="447" text-anchor="middle">needs a remote embedder</text>
  </g>
  <line class="edge" x1="230" y1="330" x2="230" y2="246" marker-end="url(#arrow)"/>
  <text class="edge-label" x="242" y="294" text-anchor="start">registered</text>
  <line class="edge" x1="390" y1="170" x2="624" y2="170" marker-end="url(#arrow)"/>
  <text class="edge-label" x="507" y="158" text-anchor="middle">vectors</text>
  <text class="caption" x="510" y="545" text-anchor="middle">Solid arrows: ingestion. The enterprise server cannot call a local embedder.</text>
</svg>
