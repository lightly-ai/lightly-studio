<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Your Own Embedding Model on Your Machine</title>
  <desc id="desc">A Python script on your machine reads images from your storage, embeds them with your registered embedder, and sends the embeddings to LightlyStudio Enterprise. The embedding plot reads the stored embeddings. Optionally, search and text axes send each query to your own embedding server.</desc>
  <defs>
    <style>
      .panel-customer { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 2; }
      .panel-machine { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 6 4; }
      .panel-lightly { fill: #eef2ff; stroke: #94a3b8; stroke-width: 2; }
      .node-ui { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .node-service { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .node-optional { fill: #ffffff; stroke: #16a34a; stroke-width: 2; stroke-dasharray: 6 4; }
      .node-data { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
      .node-external { fill: #fef3c7; stroke: #b45309; stroke-width: 2; }
      .panel-title { fill: #334155; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; }
      .label { fill: #0f172a; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 17px; font-weight: 700; }
      .small { fill: #475569; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 14px; }
      .code { fill: #475569; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 14px; }
      .edge-label { fill: #475569; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 14px; font-style: italic; }
      .caption { fill: #64748b; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 14px; }
      .edge { stroke: #475569; stroke-width: 3; stroke-linecap: round; fill: none; }
      .edge-search { stroke: #16a34a; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 8 6; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-search" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Your infrastructure -->
  <rect class="panel-customer" x="20" y="10" width="320" height="550" rx="16" ry="16"/>
  <text class="panel-title" x="40" y="42">Your Infrastructure</text>

  <g>
    <title>Media Storage</title>
    <rect class="node-external" x="50" y="90" width="260" height="92" rx="12" ry="12"/>
    <text class="label" x="180" y="128" text-anchor="middle">Media Storage</text>
    <text class="small" x="180" y="153" text-anchor="middle">local files or cloud bucket</text>
  </g>

  <g>
    <title>Embedding Server (optional)</title>
    <rect class="node-optional" x="50" y="430" width="260" height="92" rx="12" ry="12"/>
    <text class="label" x="180" y="468" text-anchor="middle">Embedding Server</text>
    <text class="small" x="180" y="493" text-anchor="middle">optional, embeds queries</text>
  </g>

  <!-- Your machine -->
  <rect class="panel-machine" x="420" y="10" width="340" height="550" rx="16" ry="16"/>
  <text class="panel-title" x="440" y="42">Your Machine</text>

  <g>
    <title>Python Script</title>
    <rect class="node-service" x="450" y="90" width="280" height="92" rx="12" ry="12"/>
    <text class="label" x="590" y="128" text-anchor="middle">Python Script</text>
    <text class="code" x="590" y="153" text-anchor="middle">ls.connect()</text>
  </g>

  <g>
    <title>Embedder</title>
    <rect class="node-service" x="450" y="260" width="280" height="92" rx="12" ry="12"/>
    <text class="label" x="590" y="298" text-anchor="middle">Embedder</text>
    <text class="small" x="590" y="323" text-anchor="middle">your own model</text>
  </g>

  <!-- LightlyStudio Enterprise -->
  <rect class="panel-lightly" x="840" y="10" width="320" height="550" rx="16" ry="16"/>
  <text class="panel-title" x="860" y="42">LightlyStudio Enterprise</text>

  <g>
    <title>Stored Embeddings</title>
    <rect class="node-data" x="870" y="90" width="260" height="92" rx="12" ry="12"/>
    <text class="label" x="1000" y="128" text-anchor="middle">Stored Embeddings</text>
    <text class="small" x="1000" y="153" text-anchor="middle">images, and crops if supported</text>
  </g>

  <g>
    <title>Embedding Plot</title>
    <rect class="node-ui" x="870" y="260" width="260" height="92" rx="12" ry="12"/>
    <text class="label" x="1000" y="298" text-anchor="middle">Embedding Plot</text>
    <text class="small" x="1000" y="323" text-anchor="middle">default layout, any model</text>
  </g>

  <g>
    <title>Search</title>
    <rect class="node-ui" x="870" y="430" width="260" height="92" rx="12" ry="12"/>
    <text class="label" x="1000" y="468" text-anchor="middle">Search and Text Axes</text>
    <text class="small" x="1000" y="493" text-anchor="middle">text and image queries</text>
  </g>

  <!-- Ingestion edges -->
  <line class="edge" x1="310" y1="136" x2="444" y2="136" marker-end="url(#arrow)"/>
  <text class="edge-label" x="380" y="124" text-anchor="middle">images</text>

  <line class="edge" x1="590" y1="260" x2="590" y2="188" marker-end="url(#arrow)"/>
  <text class="edge-label" x="602" y="229">registered</text>

  <line class="edge" x1="730" y1="136" x2="864" y2="136" marker-end="url(#arrow)"/>
  <text class="edge-label" x="800" y="124" text-anchor="middle">vectors</text>

  <line class="edge" x1="1000" y1="182" x2="1000" y2="254" marker-end="url(#arrow)"/>
  <text class="edge-label" x="1012" y="229">reads</text>

  <!-- Search edge -->
  <line class="edge-search" x1="870" y1="476" x2="316" y2="476" marker-end="url(#arrow-search)"/>
  <text class="edge-label" x="590" y="464" text-anchor="middle" style="fill: #16a34a;">query</text>

  <text class="caption" x="590" y="600" text-anchor="middle">Solid arrows: ingestion. Dashed arrow: optional, search and text axes with your own model.</text>
</svg>
