<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc">
  <title id="title">Your Own Model in a Remote Embedder</title>
  <desc id="desc">A Python script sends your images to your remote embedder, which returns the vectors. The script sends the vectors to LightlyStudio Enterprise, where the embedding plot and sampling read them. Similarity search sends each query to the same remote embedder.</desc>
  <defs>
    <style>
      .panel-env { fill: none; stroke: #dcdcdc; stroke-width: 2; stroke-dasharray: 8 6; }
      .panel-ls { fill: #eaf7fd; }
      .panel-title { fill: #0d0d0d; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .panel-title-ls { fill: #1277a5; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #e4e4e4; stroke-width: 2; }
      .card-off { fill: #fafafa; stroke: #dcdcdc; stroke-width: 2; stroke-dasharray: 7 5; }
      .icon { fill: none; stroke: #0d0d0d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-off { fill: none; stroke: #a3a3a3; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .title { fill: #0d0d0d; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .title-off { fill: #a3a3a3; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .sub { fill: #4a4a4a; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 17px; }
      .mono { fill: #4a4a4a; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 16px; }
      .edge { stroke: #6e6e6e; stroke-width: 2.5; fill: none; }
      .edge-search { stroke: #1277a5; stroke-width: 2.5; stroke-dasharray: 9 7; fill: none; }
      .edge-label { fill: #6e6e6e; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 17px; font-style: italic; }
      .edge-label-search { fill: #1277a5; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 17px; font-style: italic; }
      .caption { fill: #6e6e6e; font-family: -apple-system, "Segoe UI", Inter, Arial, sans-serif; font-size: 16px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#6e6e6e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-search" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1277a5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="panel-env" x="30" y="20" width="400" height="490" rx="24"/>
  <text class="panel-title" x="62" y="62">Your Environment</text>
  <rect class="panel-ls" x="590" y="20" width="400" height="490" rx="24"/>
  <text class="panel-title-ls" x="622" y="62">LightlyStudio Enterprise</text>
  <g>
    <title>Python Script</title>
    <rect class="card" x="70" y="100" width="320" height="140" rx="16"/>
    <g class="icon" transform="translate(215 122) scale(1.25)"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m6 9 3 3-3 3"/><path d="M12 15h6"/></g>
    <text class="title" x="230" y="190" text-anchor="middle">Python Script</text>
    <text class="mono" x="230" y="217" text-anchor="middle">ls.connect()</text>
  </g>
  <g>
    <title>Remote Embedder</title>
    <rect class="card" x="70" y="330" width="320" height="140" rx="16"/>
    <g class="icon" transform="translate(215 352) scale(1.25)"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01"/><path d="M6 17h.01"/></g>
    <text class="title" x="230" y="420" text-anchor="middle">Remote Embedder</text>
    <text class="sub" x="230" y="447" text-anchor="middle">your model on a server</text>
  </g>
  <g>
    <title>Plot and Sampling</title>
    <rect class="card" x="630" y="100" width="320" height="140" rx="16"/>
    <g class="icon" transform="translate(775 122) scale(1.25)"><path d="M3 3v18h18"/><circle cx="8.5" cy="14.5" r="1.6"/><circle cx="13" cy="9" r="1.6"/><circle cx="17.5" cy="12.5" r="1.6"/><circle cx="12" cy="16" r="1.6"/></g>
    <text class="title" x="790" y="190" text-anchor="middle">Plot and Sampling</text>
    <text class="sub" x="790" y="217" text-anchor="middle">read the stored vectors</text>
  </g>
  <g>
    <title>Similarity Search</title>
    <rect class="card" x="630" y="330" width="320" height="140" rx="16"/>
    <g class="icon" transform="translate(775 352) scale(1.25)"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></g>
    <text class="title" x="790" y="420" text-anchor="middle">Similarity Search</text>
    <text class="sub" x="790" y="447" text-anchor="middle">text and image queries</text>
  </g>
  <line class="edge" x1="190" y1="240" x2="190" y2="324" marker-end="url(#arrow)"/>
  <text class="edge-label" x="178" y="288" text-anchor="end">images</text>
  <line class="edge" x1="270" y1="330" x2="270" y2="246" marker-end="url(#arrow)"/>
  <text class="edge-label" x="282" y="294" text-anchor="start">vectors</text>
  <line class="edge" x1="390" y1="170" x2="624" y2="170" marker-end="url(#arrow)"/>
  <text class="edge-label" x="507" y="158" text-anchor="middle">vectors</text>
  <line class="edge-search" x1="630" y1="400" x2="396" y2="400" marker-end="url(#arrow-search)"/>
  <text class="edge-label-search" x="513" y="388" text-anchor="middle">search query</text>
  <text class="caption" x="510" y="545" text-anchor="middle">Solid arrows: ingestion. Dashed arrow: search, on the same remote embedder.</text>
</svg>
