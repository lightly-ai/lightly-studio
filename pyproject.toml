# The workspace root is virtual: it ships no code and is never published. It exists so that
# every member resolves against one `uv.lock`. That is what will let `lightly-studio` depend on
# `lightly-studio-serve` for the shared wire models without the two ever drifting apart.
[tool.uv.workspace]
members = ["lightly_studio", "lightly_studio_serve"]

[tool.uv]
# CI installs uv 0.13.6. This minimum allows newer local versions, which may
# serialize uv.lock differently as uv evolves.
required-version = ">=0.13.6"
# moto[server] pulls in antlr4-python3-runtime unconstrained (latest 4.13.x), but it
# only loads it lazily for StepFunctions mocking, which we never use (moto is only
# used for S3 mocking in tests). The lightly_train plugin's omegaconf/hydra require
# antlr 4.9.* and crash on import with 4.13.x, so we pin it back to 4.9.3.
constraint-dependencies = ["antlr4-python3-runtime==4.9.3"]
# The `cpu` and `gpu` groups of lightly-studio select the torch build. They conflict, so
# uv locks one resolution for each. See lightly_studio/pyproject.toml.
conflicts = [
    [
        { package = "lightly-studio", group = "cpu" },
        { package = "lightly-studio", group = "gpu" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
