[project]
name = "lightly-studio-serve"
version = "0.1.0"
description = "Serve your own embedding model to LightlyStudio over HTTP."
readme = "README.md"
# Matches lightly-studio, so a customer stuck on an old inference image can still install it.
requires-python = ">=3.9,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
]

# An HTTP server, numpy and Pillow. This package installs next to the CUDA and torch pins of
# the customer. A heavier dependency can conflict with those pins.
dependencies = [
    "fastapi>=0.115.5",
    # `EmbeddingResult.embeddings` is a numpy array. `lightly-studio` imports that class
    # from here and indexes the array. The floor is the last release that supports
    # Python 3.9, so one floor covers all versions that `requires-python` allows.
    "numpy>=1.26.4",
    # Types `ImagePILEmbedder`. The floor is the version that `lightly-studio` resolves.
    "pillow>=11.0.0",
    "pydantic>=2.0",
    # Starlette parses the multipart bodies with this package. The floor holds the fixes
    # for the parser denial-of-service advisories, the last of them CVE-2026-53540. A host
    # on Python 3.9 keeps those problems, because 0.0.20 is the last release it can reach.
    # TODO(Iunir, 09/2026): Remove the Python 3.9 pin when `lightly-studio` removes
    # Python 3.9.
    "python-multipart>=0.0.31; python_version >= '3.10'",
    "python-multipart>=0.0.20; python_version < '3.10'",
    # `lightly_studio_serve.middleware` is ASGI middleware, so it imports the ASGI types
    # from starlette directly. FastAPI installs starlette, but a direct import needs a
    # floor of its own. This is the floor that the `fastapi` floor above resolves.
    "starlette>=0.40.0",
    "uvicorn>=0.32.1",
]

[dependency-groups]
# The same floors as the repository's other Python packages, so the tooling behaves alike.
dev = [
    # The FastAPI test client is an httpx transport.
    "httpx>=0.27.2",
    "mypy>=1.19.1",
    "pytest>=8.3.3",
    "ruff>=0.7.4",
]

[tool.mypy]
strict = true
disallow_untyped_defs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
warn_untyped_fields = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
python_files = "tests/*.py tests/**/*.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/lightly_studio_serve"]

[tool.hatch.build.targets.wheel]
packages = ["src/lightly_studio_serve"]
